# Grouping: version updates arrive as one PR per group (OpenTelemetry modules together, minor and
# patch together, majors individually); security updates arrive as one PR per ecosystem+directory.
# Group order matters (first match wins). There is deliberately NO `ignore` rule: how `ignore`
# interacts with security updates is unverified. Dependabot reads this file from the DEFAULT branch
# (main) only, so none of this is live until develop is promoted.
version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/infra/terraform/provider"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    groups:
      opentelemetry:
        applies-to: version-updates
        patterns:
          - "go.opentelemetry.io/*"
      go-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      go-security:
        applies-to: security-updates
        patterns:
          - "*"

