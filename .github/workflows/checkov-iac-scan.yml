name: Checkov IaC Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, Thursday 04:13 UTC — Checkov's policy DB updates
    # independently of code changes.
    - cron: "13 4 * * 4"

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov (Helm + Terraform)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@a8664e3a0549367977f0cda990a34311835c87c0 # v12.3123.0
        with:
          directory: infra
          framework: terraform,helm
          quiet: true
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
          category: checkov
