name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  go-services:
    name: Go Services (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [flag-api, gateway, evaluator, gitops-sync, ast-rewriter, marketplace, tombstone-operator]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Go 1.25
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: go vet
        working-directory: services/${{ matrix.service }}
        env:
          GOWORK: "off"
        run: go vet ./...

      - name: go build
        working-directory: services/${{ matrix.service }}
        env:
          GOWORK: "off"
        run: go build ./...

      - name: go test with coverage
        working-directory: services/${{ matrix.service }}
        env:
          GOWORK: "off"
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: services/${{ matrix.service }}/coverage.out
          flags: go
          name: ${{ matrix.service }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  python-intelligence:
    name: Python Intelligence Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/intelligence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: ruff check
        run: |
          pip install ruff==0.15.9
          ruff check .

      - name: pytest with coverage
        run: |
          uv pip install --system pytest-cov pytest-asyncio
          python -m pytest tests/ --cov=app --cov-report=xml:coverage.xml -v --asyncio-mode=auto

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: services/intelligence/coverage.xml
          flags: python
          name: intelligence
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        # Physical directory still named @flagmind (content renamed to @tombstone)
        working-directory: packages/sdks/@flagmind/core
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          # No cache-dependency-path — package-lock.json generated on first npm install

      - name: npm install
        run: npm install

      - name: build @tombstone/core
        run: npm run build

      - name: test @tombstone/core (evaluation + contract + streaming/lag)
        run: npm test

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdks/tombstone-python-sdk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install SDK and test deps
        run: uv pip install --system mmh3 pytest && uv pip install --system -e .

      - name: pytest
        run: python -m pytest tests/ -v

  ruby-sdk:
    name: Ruby SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: packages/sdks/tombstone-ruby-sdk
      - run: cd packages/sdks/tombstone-ruby-sdk && bundle exec rspec

  java-sdk:
    name: Java SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Run Java SDK tests
        run: cd packages/sdks/tombstone-java-sdk && gradle test

  dotnet-sdk:
    name: .NET SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Run .NET SDK tests
        run: cd packages/sdks/tombstone-dotnet-sdk && dotnet test tests/FlagMind.Tests/FlagMind.Tests.csproj

  terraform-provider:
    name: Terraform Provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - name: build and vet
        env:
          GOWORK: "off"
        run: cd infra/terraform/provider && go mod tidy && go build ./... && go vet ./...

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install workspace deps
        # npm workspaces resolve against the root lockfile; --ignore-scripts
        # skips husky/prepare (matches the dashboard deploy workflow).
        run: npm ci --ignore-scripts
      - name: Typecheck + build dashboard
        # `npm run build` is `tsc -b tsconfig.app.json && vite build` — the tsc
        # step is the typecheck gate; vite build is the production bundle.
        working-directory: workspace-dashboard
        run: npm run build
      - name: Test dashboard
        working-directory: workspace-dashboard
        run: npm test

  flag-api-migrations:
    name: flag-api Migration Runner
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image — schema.sql's embedding vector(768) column needs it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tombstone
          POSTGRES_PASSWORD: tombstone
          POSTGRES_DB: tombstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tombstone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - name: DB-backed verification (migrations, token hashing, audit chain integrity)
        working-directory: services/flag-api
        env:
          GOWORK: "off"
          # Keyword/value DSN (no URL); lib/pq reads the password from PGPASSWORD.
          PGPASSWORD: tombstone
          TEST_DATABASE_URL: "host=localhost port=5432 user=tombstone dbname=tombstone sslmode=disable"
        run: |
          go build ./cmd/migrate ./internal/db/ ./internal/audit/ ./internal/api/v1/
          # SEPARATE, SEQUENTIAL invocations on purpose. `go test` runs different
          # packages in PARALLEL, and all three suites share this one database:
          # internal/db asserts a FRESH apply of every migration, so it must see a
          # pristine DB and must run BEFORE the others, whose fixtures call Migrate
          # (idempotent, but only correct to run against an already-baselined DB).
          # A single combined invocation raced and applied the schema out from
          # under the migration test. Do not merge these back into one line.
          go test ./internal/db/ -v
          go test ./internal/audit/ -v
          # TEN-1a: proves cross-tenant isolation against a real Postgres — same
          # key created in two different projects, every handler checked for leaks.
          # SEC-3b: proves propose->quorum->apply actually mutates flag_environments,
          # not just the change_requests row's own status. SEC-3b part 2: proves
          # require_approval actually blocks UpdateEnvironment and that a valid
          # break-glass token bypasses it exactly once. Same package, same DB, run
          # together (one process, sequential top-level tests, no t.Parallel)
          # rather than separate invocations — no fixture collision between them.
          go test ./internal/api/v1/ -run 'TestTenancyIsolation|TestChangeRequestProposeQuorumAndApply|TestRequireApprovalGate' -v
