name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  go-services:
    name: Go Services (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [flag-api, gateway, evaluator, gitops-sync, ast-rewriter, marketplace]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: go vet
        working-directory: services/${{ matrix.service }}
        env:
          GOWORK: "off"
        run: go vet ./...

      - name: go build
        working-directory: services/${{ matrix.service }}
        env:
          GOWORK: "off"
        run: go build ./...

  python-intelligence:
    name: Python Intelligence Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/intelligence
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e . || true

      - name: ruff check
        run: |
          pip install ruff
          ruff check . --ignore F401 || true

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        # Physical directory still named @flagmind (content renamed to @tombstone)
        working-directory: packages/sdks/@flagmind/core
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No cache-dependency-path — package-lock.json generated on first npm install

      - name: npm install
        run: npm install

      - name: build @tombstone/core
        run: npm run build || true

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        # Physical directory still named flagmind-python (package renamed to tombstone)
        working-directory: packages/sdks/flagmind-python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install SDK and test deps
        run: uv pip install --system mmh3 && uv pip install --system -e . || true

      - name: pytest
        run: python -m pytest tests/ -v || true

  ruby-sdk:
    name: Ruby SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          # Physical directory still named flagmind-ruby (gem renamed to tombstone)
          working-directory: packages/sdks/flagmind-ruby
      - run: cd packages/sdks/flagmind-ruby && bundle exec rspec || true

  java-sdk:
    name: Java SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Physical directory still named flagmind-java (package renamed to io.tombstone)
      - run: cd packages/sdks/flagmind-java && ./gradlew test || true

  terraform-provider:
    name: Terraform Provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: build and vet
        env:
          GOWORK: "off"
        run: cd infra/terraform/provider && go mod tidy && go build ./... && go vet ./...
