name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  go-services:
    name: Go Services (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [flag-api, gateway, evaluator, gitops-sync, ast-rewriter, marketplace, tombstone-operator]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Go 1.25
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: go vet
        working-directory: services/${{ matrix.service }}
        env:
          GOWORK: "off"
        run: go vet ./...

      - name: go build
        working-directory: services/${{ matrix.service }}
        env:
          GOWORK: "off"
        run: go build ./...

      - name: go test with coverage
        working-directory: services/${{ matrix.service }}
        env:
          GOWORK: "off"
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: services/${{ matrix.service }}/coverage.out
          flags: go
          name: ${{ matrix.service }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  python-intelligence:
    name: Python Intelligence Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/intelligence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: ruff check
        run: |
          pip install ruff
          ruff check . --ignore F401

      - name: pytest with coverage
        run: |
          uv pip install --system pytest-cov pytest-asyncio
          python -m pytest tests/ --cov=app --cov-report=xml:coverage.xml -v --asyncio-mode=auto

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: services/intelligence/coverage.xml
          flags: python
          name: intelligence
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        # Physical directory still named @flagmind (content renamed to @tombstone)
        working-directory: packages/sdks/@flagmind/core
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          # No cache-dependency-path — package-lock.json generated on first npm install

      - name: npm install
        run: npm install

      - name: build @tombstone/core
        run: npm run build

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        # Physical directory still named flagmind-python (package renamed to tombstone)
        working-directory: packages/sdks/flagmind-python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install SDK and test deps
        run: uv pip install --system mmh3 && uv pip install --system -e .

      - name: pytest
        run: python -m pytest tests/ -v

  ruby-sdk:
    name: Ruby SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          # Physical directory still named flagmind-ruby (gem renamed to tombstone)
          working-directory: packages/sdks/flagmind-ruby
      - run: cd packages/sdks/flagmind-ruby && bundle exec rspec

  java-sdk:
    name: Java SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      # Physical directory still named flagmind-java (package renamed to io.tombstone)
      - run: cd packages/sdks/flagmind-java && ./gradlew test

  terraform-provider:
    name: Terraform Provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - name: build and vet
        env:
          GOWORK: "off"
        run: cd infra/terraform/provider && go mod tidy && go build ./... && go vet ./...
