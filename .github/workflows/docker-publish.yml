name: Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/tombstone

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: flag-api
            context: services/flag-api
            port: 8081
          - name: gateway
            context: services/gateway
            port: 8080
          - name: evaluator
            context: services/evaluator
            port: 8082
          - name: ast-rewriter
            context: services/ast-rewriter
            port: 8085
          - name: marketplace
            context: services/marketplace
            port: 8086
          - name: tombstone-operator
            context: services/tombstone-operator
            port: 8088

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-intelligence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-intelligence
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push intelligence
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/intelligence
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true

  # OFF unless the repository variable ENABLE_GITOPS_TAG_BUMP is 'true' (it is unset).
  # Do not set it until the three problems below are fixed.
  #
  # 1. No cluster consumes gitops/ yet (OKE is not provisioned and no Flux
  #    bootstrap has ever succeeded), so a bump has nothing to deploy to.
  # 2. The final `git push` goes straight to main. The branch ruleset on main
  #    requires a pull request and has no bypass actors, and Actions may not
  #    open PRs (can_approve_pull_request_reviews is false), so the push is
  #    rejected. Needs a PR-based flow or a dedicated token/app allowed to
  #    bypass, and a repo-level decision on which.
  # 3. helmrelease.yaml still pins v1.3.0 and carries Flux $imagepolicy markers,
  #    so Flux image automation (gitops/infrastructure/controllers/image-automation)
  #    is the intended tag-bump mechanism once a cluster exists. Decide whether
  #    this job should exist at all alongside it.
  #
  # The tag format is already fixed below: images are published as X.Y.Z (the
  # docker/metadata-action semver pattern strips the leading v), so the tag
  # written into the HelmRelease must not carry one.
  update-gitops-tags:
    name: Update GitOps image tags
    runs-on: ubuntu-latest
    needs: [publish, publish-intelligence]
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_GITOPS_TAG_BUMP == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Extract version tag
        id: tag
        run: |
          # Safe: GITHUB_REF_NAME is a controlled GitHub variable, not attacker-supplied input.
          # Strip the leading v: images are published as X.Y.Z, not vX.Y.Z.
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update image tags in HelmRelease
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          FILE="gitops/apps/production/tombstone/helmrelease.yaml"
          # Update each service tag line that has an imagepolicy marker
          for SERVICE in flag-api gateway evaluator intelligence marketplace; do
            # Replace tag: "vX.Y.Z" # {"$imagepolicy": "flux-system:tombstone-${SERVICE}:tag"}
            sed -i "s|tag: \".*\" # {\"\\$imagepolicy\": \"flux-system:tombstone-${SERVICE}:tag\"}|tag: \"${VERSION}\" # {\"\\$imagepolicy\": \"flux-system:tombstone-${SERVICE}:tag\"}|g" "$FILE"
          done

      - name: Commit updated tags
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/production/tombstone/helmrelease.yaml
          git diff --staged --quiet || git commit -m "chore(infra): update image tags to ${VERSION}"
          git push
