name: Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/tombstone

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: flag-api
            context: services/flag-api
            port: 8081
          - name: gateway
            context: services/gateway
            port: 8080
          - name: evaluator
            context: services/evaluator
            port: 8082
          - name: ast-rewriter
            context: services/ast-rewriter
            port: 8085
          - name: marketplace
            context: services/marketplace
            port: 8086

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-intelligence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-intelligence
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push intelligence
        uses: docker/build-push-action@v6
        with:
          context: services/intelligence
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true

  update-gitops-tags:
    name: Update GitOps image tags
    runs-on: ubuntu-latest
    needs: [publish, publish-intelligence]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Extract version tag
        id: tag
        run: |
          # Safe: GITHUB_REF is a controlled GitHub variable, not attacker-supplied input
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Update image tags in HelmRelease
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          FILE="gitops/apps/production/tombstone/helmrelease.yaml"
          # Update each service tag line that has an imagepolicy marker
          for SERVICE in flag-api gateway evaluator intelligence marketplace; do
            # Replace tag: "vX.Y.Z" # {"$imagepolicy": "flux-system:tombstone-${SERVICE}:tag"}
            sed -i "s|tag: \".*\" # {\"\\$imagepolicy\": \"flux-system:tombstone-${SERVICE}:tag\"}|tag: \"${VERSION}\" # {\"\\$imagepolicy\": \"flux-system:tombstone-${SERVICE}:tag\"}|g" "$FILE"
          done

      - name: Commit updated tags
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/production/tombstone/helmrelease.yaml
          git diff --staged --quiet || git commit -m "chore(infra): update image tags to ${VERSION}"
          git push
