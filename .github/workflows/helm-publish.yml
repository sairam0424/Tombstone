name: Publish Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - 'infra/helm/**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-operator-chart:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io \
            --username "$REGISTRY_USER" \
            --password-stdin

      - name: Extract chart version
        id: chart-version
        run: |
          VERSION=$(grep '^version:' infra/helm/tombstone-operator/Chart.yaml | awk '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Package tombstone-operator chart
        run: |
          helm package infra/helm/tombstone-operator/ --destination /tmp/

      - name: Push tombstone-operator chart to GHCR
        env:
          CHART_VERSION: ${{ steps.chart-version.outputs.version }}
        run: |
          helm push "/tmp/tombstone-operator-${CHART_VERSION}.tgz" \
            oci://ghcr.io/sairam0424/charts
