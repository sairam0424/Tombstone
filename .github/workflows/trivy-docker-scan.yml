name: Trivy Docker Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, Thursday 03:29 UTC — Trivy's vulnerability DB updates
    # independently of code changes.
    - cron: "29 3 * * 4"

permissions:
  contents: read

jobs:
  trivy-config:
    name: Trivy Dockerfile config scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # Config/misconfiguration scan of the 8 service Dockerfiles — no
      # image build required.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: services
          format: sarif
          output: trivy-dockerfile-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results to code-scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-dockerfile-results.sarif
          category: trivy-dockerfile
