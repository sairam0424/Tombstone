<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Tombstone logo: arched stone monument -->
  <!-- Outer tombstone shape: arch top + rectangular body -->
  <path d="
    M 136 480
    L 136 220
    A 120 120 0 0 1 376 220
    L 376 480
    Z
  " fill="#1a1a2e" rx="8" ry="8"/>

  <!-- Inner arch cutout for depth effect -->
  <path d="
    M 160 472
    L 160 228
    A 96 96 0 0 1 352 228
    L 352 472
    Z
  " fill="none" stroke="#58a6ff" stroke-width="3" opacity="0.4"/>

  <!-- Horizontal line across stone (epitaph line) -->
  <line x1="176" y1="320" x2="336" y2="320" stroke="#58a6ff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Second epitaph line -->
  <line x1="196" y1="356" x2="316" y2="356" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Third epitaph line -->
  <line x1="210" y1="388" x2="302" y2="388" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Base / pedestal -->
  <rect x="104" y="476" width="304" height="20" rx="4" fill="#1a1a2e"/>
  <rect x="80" y="490" width="352" height="14" rx="4" fill="#1a1a2e"/>
</svg>
