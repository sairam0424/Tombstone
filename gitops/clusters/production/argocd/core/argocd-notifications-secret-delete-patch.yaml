# gitops/clusters/production/argocd/core/argocd-notifications-secret-delete-patch.yaml
# Same rationale as argocd-notifications-cm-delete-patch.yaml: removes the vendored empty
# stub Secret/argocd-notifications-secret so only the real one from
# ../notifications/notifications.yaml (with the marketplace token) survives the build.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
$patch: delete
