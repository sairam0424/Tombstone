# gitops/clusters/production/argocd/core/kustomization.yaml
# Argo CD install + Lua health-check ConfigMap patches. Shared by every provider mode
# that runs Argo CD (argocd, both).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - argocd-install-v2.11.0.yaml
patches:
  - path: argocd-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: argocd-cmd-params-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
