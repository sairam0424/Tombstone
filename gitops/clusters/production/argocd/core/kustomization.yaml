# gitops/clusters/production/argocd/core/kustomization.yaml
# Argo CD install + Lua health-check ConfigMap patches. Shared by every provider mode
# that runs Argo CD (argocd, both).
# namespace.yaml creates the argocd Namespace before Flux/kubectl applies the rest —
# the vendored install manifest assumes the namespace already exists. Staging had this
# fix on main (commits a6373d9/5a98ee3) but production never did; closing that gap here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - argocd-install-v2.11.0.yaml
patches:
  - path: argocd-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: argocd-cmd-params-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
  - path: argocd-notifications-cm-delete-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-notifications-cm
  - path: argocd-notifications-secret-delete-patch.yaml
    target:
      kind: Secret
      name: argocd-notifications-secret
