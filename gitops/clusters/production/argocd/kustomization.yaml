# gitops/clusters/production/argocd/kustomization.yaml
# Composes the four sub-bases below. Split into core/app-of-apps/rollouts/notifications
# so gitops/providers/argocd/ and gitops/providers/both/ can each select a subset via
# directory-base cross-references (Kustomize's security model blocks referencing
# individual loose files outside a kustomization's own directory tree — referencing a
# directory that itself has a kustomization.yaml is fine).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - core
  - app-of-apps
  - rollouts
  - notifications
