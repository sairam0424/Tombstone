---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: tombstone
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/sairam0424/Tombstone
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tombstone-infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: tombstone
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tombstone-operator
      namespace: tombstone
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tombstone-apps
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: tombstone-infrastructure
  path: ./gitops/apps/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: tombstone
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tombstone-flags
  namespace: flux-system
spec:
  interval: 2m
  dependsOn:
    - name: tombstone-apps
  path: ./gitops/flags/overlays/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: tombstone
  timeout: 2m
