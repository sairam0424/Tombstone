# gitops/clusters/staging/argocd/core/kustomization.yaml
# Argo CD install + Lua health-check ConfigMap patches. Shared by every provider mode
# that runs Argo CD (argocd, both).
# namespace.yaml creates the argocd Namespace before Flux/kubectl applies the rest —
# the vendored install manifest assumes the namespace already exists.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - argocd-install-v2.11.0.yaml
patches:
  - path: argocd-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: argocd-cmd-params-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
