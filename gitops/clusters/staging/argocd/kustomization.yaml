# gitops/clusters/staging/argocd/kustomization.yaml
# Staging uses the same Argo CD install manifest and patches as production.
# Patch files referenced from production overlay -- same health checks and params.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - argocd-install-v2.11.0.yaml
patches:
  - path: argocd-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: argocd-cmd-params-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
