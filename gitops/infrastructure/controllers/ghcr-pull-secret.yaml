# Placeholder pull-secret for ghcr.io.
# Populate BEFORE bootstrapping Flux with:
#
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --namespace flux-system \
#     --docker-server=ghcr.io \
#     --docker-username=sairam0424 \
#     --docker-password=$(gh auth token) \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The .dockerconfigjson value below is a base64-encoded empty JSON object ({})
# and is intentionally invalid — it must be replaced by the command above.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: flux-system
  annotations:
    bootstrap.tombstone.io/manual-step: populate-before-bootstrap
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: e30K
