# gitops/providers/argocd/kustomization.yaml
# Argo CD provider: Argo CD owns apps/flags; Flux retains infrastructure.
# Active when GITOPS_PROVIDER=argocd. No Rollouts, no Notifications (see providers/both/).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../clusters/production/argocd/core
  - ../../clusters/production/argocd/app-of-apps
