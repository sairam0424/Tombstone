# gitops/providers/argocd/staging/kustomization.yaml
# Argo CD provider, staging cluster: Argo CD owns apps/flags; Flux retains infrastructure.
# Active when GITOPS_PROVIDER=argocd, CLUSTER=staging. No Rollouts, no Notifications
# (see gitops/providers/both/staging/ for the full-capability mode).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../clusters/staging/argocd/core
  - ../../../clusters/staging/argocd/app-of-apps
