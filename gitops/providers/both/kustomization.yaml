# gitops/providers/both/kustomization.yaml
# Dual-controller: Flux owns infrastructure + image automation.
#                  Argo CD owns flagmind chart + flag definitions + Rollouts + Notifications.
# Active when GITOPS_PROVIDER=both (recommended for full capability).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../clusters/production/argocd/core
  - ../../clusters/production/argocd/app-of-apps
  - ../../clusters/production/argocd/rollouts
  - ../../clusters/production/argocd/notifications
