# All secrets are supplied via a .env file (see infra/.env.example).
# Copy .env.example -> .env and fill values. Never commit .env to git.

services:
  postgres:
    image: pgvector/pgvector:pg16  # includes pgvector extension for NLP search
    env_file: .env
    ports:
      - "5433:5432"   # mapped to 5433 host-side to avoid conflict with local postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../services/flag-api/internal/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tombstone"]
      interval: 5s
      timeout: 5s
      retries: 10

  # DATA-2: pools app traffic so a burst of requests doesn't exhaust
  # Postgres's own connection limit — mirrors what production does via
  # Neon's built-in pooler ("-pooler" connection string), letting the same
  # pooled-vs-direct split be exercised locally without real Neon creds.
  # Transaction pooling mode: safe for flag-api/intelligence's own traffic
  # (nothing in their hot path holds a session-scoped Postgres feature —
  # internal/audit's advisory lock is pg_advisory_XACT_lock, transaction-
  # scoped, which transaction pooling supports fine). NOT safe for
  # cmd/migrate, which uses the session-scoped pg_advisory_lock/unlock pair
  # pinned to one physical connection for the whole run — that's exactly
  # why migrations keep using DB_URL_DIRECT, straight to postgres, below.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: ${POSTGRES_USER:-tombstone}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-tombstone}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "20"
      # Postgres 16 (the postgres service's image) defaults password_encryption
      # to scram-sha-256, not md5 (this image's own default AUTH_TYPE) — a
      # mismatch here fails every login with "wrong password type".
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"   # host-side: psql -h localhost -p 6432 -U tombstone tombstone
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-tombstone}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # mapped to 6380 host-side to avoid conflict with local redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    # Optional — only needed if CONSUMER_BACKEND=kafka
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  flag-api:
    build:
      context: ../services/flag-api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - certs:/certs
    environment:
      - MTLS_ENABLED=${MTLS_ENABLED:-false}
      - CERTS_DIR=/certs
    ports:
      - "8081:8081"
    restart: unless-stopped

  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      flag-api:
        condition: service_started
    env_file: .env
    volumes:
      - certs:/certs
    environment:
      PORT: "8080"
      FLAG_API_URL: http://flag-api:8081
      MTLS_ENABLED: ${MTLS_ENABLED:-false}
      CERTS_DIR: /certs
      CONSUMER_BACKEND: streams
    ports:
      - "8080:8080"
    restart: unless-stopped

  evaluator:
    build:
      context: ../services/evaluator
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      flag-api:
        condition: service_started
    env_file: .env
    volumes:
      - certs:/certs
    environment:
      PORT: "8082"
      FLAG_API_URL: http://flag-api:8081
      MTLS_ENABLED: ${MTLS_ENABLED:-false}
      CERTS_DIR: /certs
    ports:
      - "8082:8082"
    restart: unless-stopped

  intelligence:
    build:
      context: ../services/intelligence
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: "8083"
      EMBEDDING_BACKEND: local
      # INT-4: this used to say "Intelligence uses Kafka for telemetry
      # events" and set CONSUMER_BACKEND=kafka -- that was never actually
      # true. TelemetryConsumer reads Kafka topics tombstone.flag.evaluated
      # / tombstone.flag.changed, but NOTHING in any Go service has ever
      # published to either topic (confirmed via a repo-wide search for
      # producer code) -- CONSUMER_BACKEND=kafka silently ran a consumer
      # against two topics with zero producers, so flag-change-driven
      # features (embedding sync, dep-graph updates, and now flag-archival
      # anomaly-state eviction) were ALL dead in this compose file's
      # config, found by adversarial review of PR #210. Redis Streams
      # (tombstone:stream:{env}) IS the real, live transport -- the same
      # one gateway/evaluator already consume from -- so this switches to
      # it, matching what actually works.
      CONSUMER_BACKEND: redis
      TOMBSTONE_ENVIRONMENTS: production
      # INT-6: dogfood case -- scans THIS repo for stale-flag code
      # references via ast-rewriter's own /repo mount below, not a real
      # multi-tenant customer-repo mechanism (not yet designed).
      AST_REWRITER_URL: http://ast-rewriter:8085
      AST_REWRITER_REPO_PATH: /repo
    ports:
      - "8083:8083"
    restart: unless-stopped

  gitops-sync:
    build:
      context: ../services/gitops-sync
      dockerfile: Dockerfile
    depends_on:
      flag-api:
        condition: service_started
    env_file: .env
    environment:
      PORT: "8084"
      FLAG_API_URL: http://flag-api:8081
    ports:
      - "8084:8084"
    restart: unless-stopped

  ast-rewriter:
    build:
      context: ../services/ast-rewriter
      dockerfile: Dockerfile
    depends_on:
      flag-api:
        condition: service_started
    env_file: .env
    environment:
      PORT: "8085"
    # INT-6: read-only mount of this repo's own root so scanner.
    # ScanDirectory has something real to walk for the dogfood case --
    # AST_REWRITER_REPO_PATH=/repo (intelligence's env, above) must match
    # this mount point.
    volumes:
      - ../:/repo:ro
    ports:
      - "8085:8085"
    restart: unless-stopped

  marketplace:
    build:
      context: ../services/marketplace
      dockerfile: Dockerfile
    env_file: .env
    environment:
      PORT: "8086"
    ports:
      - "8086:8086"
    restart: unless-stopped

  dashboard:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../workspace-dashboard:/app
      - dashboard_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - flag-api
      - gateway
    environment:
      # VITE_* vars are inlined at build/serve time into browser JS.
      # localhost resolves via published host ports from the user's browser — correct for CSR SPAs.
      # Do NOT replace with Docker service names (flag-api, gateway, etc.) — that breaks browser fetches.
      VITE_API_URL: http://localhost:8081
      VITE_GATEWAY_URL: http://localhost:8080
      VITE_EVAL_URL: http://localhost:8082
      VITE_INTEL_URL: http://localhost:8083
      VITE_MARKETPLACE_URL: http://localhost:8086
      VITE_SDK_TOKEN: sdk-dev-token-change-in-prod
      VITE_ENABLE_INTELLIGENCE: "true"
      VITE_ENABLE_EVALUATOR: "true"
      VITE_ENABLE_MARKETPLACE: "true"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    profiles:
      - clickhouse

volumes:
  postgres_data:
  dashboard_modules:
  clickhouse_data:
  certs:        # shared mTLS certificates (generated by flag-api at startup when MTLS_ENABLED=true)
