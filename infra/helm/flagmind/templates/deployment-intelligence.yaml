{{- if .Values.intelligence.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tombstone.fullname" . }}-intelligence
  labels:
    {{- include "tombstone.labels" . | nindent 4 }}
    app.kubernetes.io/component: intelligence
spec:
  {{- if not .Values.intelligence.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "tombstone.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: intelligence
  template:
    metadata:
      labels:
        {{- include "tombstone.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: intelligence
    spec:
      serviceAccountName: {{ include "tombstone.serviceAccountName" . }}
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "tombstone.podSecurityContext" . | nindent 8 }}
      {{- include "tombstone.topologySpreadConstraints" (dict "component" "intelligence" "context" $) | nindent 6 }}
      containers:
        - name: intelligence
          image: "{{ .Values.global.imageRegistry }}{{ .Values.intelligence.image.repository }}:{{ .Values.intelligence.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "tombstone.containerSecurityContextBase" . | nindent 12 }}
            readOnlyRootFilesystem: {{ .Values.intelligence.readOnlyRootFilesystem }}
          ports:
            - name: http
              containerPort: {{ .Values.intelligence.service.port }}
              protocol: TCP
          # Longer tolerance than the 4 Go services -- this image bundles
          # BAAI/bge-m3 (~400MB) for NLP search, which loads into memory
          # at process startup, not just at image build time.
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.intelligence.service.port }}
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.intelligence.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.intelligence.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: tombstone-config
            - secretRef:
                name: tombstone-secrets
          env:
            - name: IS_PRIMARY_REGION
              value: {{ .Values.intelligence.isPrimaryRegion | quote }}
          resources:
            requests:
              cpu: {{ .Values.intelligence.resources.requests.cpu }}
              memory: {{ .Values.intelligence.resources.requests.memory }}
            limits:
              cpu: {{ .Values.intelligence.resources.limits.cpu }}
              memory: {{ .Values.intelligence.resources.limits.memory }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
