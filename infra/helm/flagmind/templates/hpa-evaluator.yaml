{{- if .Values.evaluator.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "tombstone.fullname" . }}-evaluator
  labels:
    {{- include "tombstone.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "tombstone.fullname" . }}-evaluator
  minReplicas: {{ .Values.evaluator.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.evaluator.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.evaluator.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
