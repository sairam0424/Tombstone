{{- if and .Values.marketplace.enabled .Values.marketplace.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "tombstone.fullname" . }}-marketplace
  labels:
    {{- include "tombstone.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "tombstone.fullname" . }}-marketplace
  minReplicas: {{ .Values.marketplace.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.marketplace.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.marketplace.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.marketplace.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
