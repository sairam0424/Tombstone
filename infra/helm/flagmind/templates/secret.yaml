apiVersion: v1
kind: Secret
metadata:
  name: tombstone-secrets
  labels:
    {{- include "tombstone.labels" . | nindent 4 }}
type: Opaque
data:
  # All values injected at deploy time. A missing value causes helm install to fail immediately
  # with a clear error rather than silently deploying placeholder base64.
  # Supply: helm upgrade tombstone ./infra/helm/flagmind \
  #   --set-string secrets.dbUrl="$DB_URL" \
  #   --set-string secrets.redisUrl="$REDIS_URL" \
  #   --set-string secrets.jwtToken="$JWT_SECRET" \
  #   --set-string secrets.apiToken="$FLAG_API_TOKEN"
  DB_URL: {{ required "secrets.dbUrl is required" .Values.secrets.dbUrl | b64enc | quote }}
  REDIS_URL: {{ required "secrets.redisUrl is required" .Values.secrets.redisUrl | b64enc | quote }}
  JWT_SECRET: {{ required "secrets.jwtToken is required" .Values.secrets.jwtToken | b64enc | quote }}
  FLAG_API_TOKEN: {{ required "secrets.apiToken is required" .Values.secrets.apiToken | b64enc | quote }}
  # EVAL-2: deliberately NOT `required` -- evaluator's SlackNotifier treats
  # an empty SLACK_WEBHOOK_URL as valid ("not configured", logs a warning
  # and skips), so hard-failing helm install here would make every
  # deployment that doesn't want Slack alerts unable to install at all.
  SLACK_WEBHOOK_URL: {{ .Values.secrets.slackWebhookUrl | default "" | b64enc | quote }}
  # SEC-4: `required`, matching dbUrl/redisUrl/jwtToken/apiToken above --
  # flag-api's own main.go treats a missing pepper as FATAL (logger.Fatal),
  # since service/break-glass tokens are stored only as HMAC(pepper, token).
  # Found missing entirely before this fix: helm install as written would
  # deploy a flag-api that crash-loops on every startup.
  TOKEN_HASH_PEPPER: {{ required "secrets.tokenHashPepper is required" .Values.secrets.tokenHashPepper | b64enc | quote }}
  # AUD-1/SEC-4: NOT required -- main.go only warns and disables audit
  # writes/verification (GET /api/v1/audit/verify -> 503) when unset.
  AUDIT_HMAC_KEY: {{ .Values.secrets.auditHmacKey | default "" | b64enc | quote }}
  # SEC-4: NOT required -- unset only disables GET /api/v1/compliance/export
  # (503), matching AUDIT_HMAC_KEY's own non-fatal treatment.
  COMPLIANCE_SIGNING_KEY: {{ .Values.secrets.complianceSigningKey | default "" | b64enc | quote }}
  COMPLIANCE_SIGNING_KEY_ID: {{ .Values.complianceSigningKeyId | default "v1" | b64enc | quote }}
  # SEC-5: NOT required -- SCIM fails closed (503) rather than open when
  # unset (SCIMAuthMiddleware), so this being blank is safe.
  SCIM_TOKEN: {{ .Values.secrets.scimToken | default "" | b64enc | quote }}
  # AUD-1b: NOT required -- gated by REKOR_ENABLED in configmap.yaml;
  # NewRekorClient warns and disables submission rather than submitting
  # signature-less entries if REKOR_ENABLED=true but this is unset.
  REKOR_SIGNING_KEY: {{ .Values.secrets.rekorSigningKey | default "" | b64enc | quote }}
