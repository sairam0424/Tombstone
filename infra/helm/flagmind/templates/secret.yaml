apiVersion: v1
kind: Secret
metadata:
  name: tombstone-secrets
  labels:
    {{- include "tombstone.labels" . | nindent 4 }}
type: Opaque
data:
  # All values injected at deploy time. A missing value causes helm install to fail immediately
  # with a clear error rather than silently deploying placeholder base64.
  # Supply: helm upgrade tombstone ./infra/helm/flagmind \
  #   --set-string secrets.dbUrl="$DB_URL" \
  #   --set-string secrets.redisUrl="$REDIS_URL" \
  #   --set-string secrets.jwtToken="$JWT_SECRET" \
  #   --set-string secrets.apiToken="$FLAG_API_TOKEN"
  DB_URL: {{ required "secrets.dbUrl is required" .Values.secrets.dbUrl | b64enc | quote }}
  REDIS_URL: {{ required "secrets.redisUrl is required" .Values.secrets.redisUrl | b64enc | quote }}
  JWT_SECRET: {{ required "secrets.jwtToken is required" .Values.secrets.jwtToken | b64enc | quote }}
  FLAG_API_TOKEN: {{ required "secrets.apiToken is required" .Values.secrets.apiToken | b64enc | quote }}
