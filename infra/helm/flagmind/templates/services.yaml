{{- if .Values.flagApi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tombstone.fullname" . }}-flag-api
  labels:
    {{- include "tombstone.labels" . | nindent 4 }}
    app.kubernetes.io/component: flag-api
spec:
  type: {{ .Values.flagApi.service.type }}
  ports:
    - port: {{ .Values.flagApi.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tombstone.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: flag-api
{{- end }}
---
{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tombstone.fullname" . }}-gateway
  labels:
    {{- include "tombstone.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tombstone.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
{{- end }}
