replicaCount: 2

global:
  imageRegistry: ""
  imagePullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: tombstone

flagApi:
  enabled: true
  image:
    repository: tombstone/flag-api
    tag: "0.1.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8081
  # INFRA-1: on by default, matching the plan's "CPU/mem HPAs on by
  # default" -- minReplicas matches the chart's own replicaCount default
  # so enabling this doesn't itself change steady-state capacity.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # INFRA-1: Go binary, no known runtime disk writes outside /tmp (which
  # every deployment template mounts as an emptyDir regardless).
  readOnlyRootFilesystem: true

gateway:
  enabled: true
  image:
    repository: tombstone/gateway
    tag: "0.1.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080
  # INFRA-1: standard CPU/mem HPA only -- the plan's own "connection-based
  # HPA (KEDA)" item is deliberately NOT implemented here. gateway's real
  # /api/v1/gateway/metrics endpoint returns plain JSON (services/gateway/
  # internal/api/v1/metrics.go), not a Prometheus-scrapeable /metrics
  # endpoint, and no Prometheus/KEDA operator exists anywhere in this
  # chart or infra/ -- OBS-1 (a separate, still-open Phase-1 backlog item)
  # is the real prerequisite for wiring genuine connection-count-based
  # autoscaling. Shipping a KEDA ScaledObject against the JSON endpoint
  # now (technically possible via KEDA's generic metrics-api trigger)
  # would be new scaffolding that looks real but is unverified against
  # any actual cluster -- the exact anti-pattern this plan exists to
  # eliminate. CPU/mem HPA is a genuine, if cruder, stopgap until OBS-1
  # lands real metrics.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  readOnlyRootFilesystem: true

evaluator:
  enabled: true
  image:
    repository: tombstone/evaluator
    tag: "0.1.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8082
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  readOnlyRootFilesystem: true

intelligence:
  enabled: true
  isPrimaryRegion: "true"
  image:
    repository: tombstone/intelligence
    tag: "0.1.0"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  service:
    type: ClusterIP
    port: 8083
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # INFRA-1: intelligence has NO securityContext hardening applied at all
  # (unlike the other 4 services) -- see deployment-intelligence.yaml's
  # own comment for why (verified empirically, not guessed: both the
  # non-root UID and capability dropping independently break this image's
  # model-cache and signal-file writes).

marketplace:
  enabled: true
  image:
    repository: tombstone/marketplace
    tag: "0.1.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8086
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  readOnlyRootFilesystem: true

secrets:
  dbUrl: ""
  redisUrl: ""
  jwtToken: ""
  apiToken: ""
  # EVAL-2: optional -- unlike the four secrets above (all `required` in
  # secret.yaml, hard-failing helm install if unset), an unset webhook just
  # makes evaluator's auto-rollback Slack alert a logged no-op, matching
  # this codebase's existing posture of treating third-party notification
  # config as optional (see infra/.env.example's own SLACK_WEBHOOK_URL).
  slackWebhookUrl: ""
  # SEC-4: `required` in secret.yaml, same as dbUrl/redisUrl/jwtToken/apiToken
  # above -- flag-api's own main.go treats a missing pepper as fatal
  # (logger.Fatal, secrets.ErrNoPepper) since service/break-glass tokens are
  # stored only as HMAC(pepper, token); without it no service token can be
  # authenticated at all. Found missing from this chart entirely -- helm
  # install as written before this fix would deploy a crash-looping
  # flag-api on every real cluster.
  tokenHashPepper: ""
  # AUD-1/SEC-4: optional -- flag-api's main.go only logs a warning and
  # disables audit-chain writes/verification (GET /api/v1/audit/verify
  # returns 503) when unset. Not fatal because a deployment that doesn't
  # need the audit trail yet should still boot.
  auditHmacKey: ""
  # SEC-4: optional -- unset only disables GET /api/v1/compliance/export
  # (503), matching complianceSigner's own non-fatal treatment in main.go.
  complianceSigningKey: ""
  # SEC-5: optional -- SCIM fails closed (503) rather than open when unset,
  # so this being blank is safe, just leaves SCIM provisioning unusable.
  scimToken: ""
  # AUD-1b: optional -- gated by REKOR_ENABLED below; NewRekorClient itself
  # warns and disables submission rather than submitting signature-less
  # entries if REKOR_ENABLED=true but this is unset.
  rekorSigningKey: ""

# SEC-4: key ID tag included alongside each compliance export signature so a
# future key rotation can be distinguished. Non-secret (not the key material
# itself), matches infra/.env.example's own default.
complianceSigningKeyId: "v1"

# AUD-1: retention window (days) the audit-log pruning loop is allowed to
# archive past. Non-secret; matches infra/.env.example's own default.
auditLogRetentionDays: 365

# AUD-1b: gates Rekor transparency-log submission; fail-open when false (the
# default) or when true with no rekorSigningKey configured above.
rekorEnabled: false

# SEC-5: without this, any user your IdP successfully authenticates is
# allowed to log in regardless of email domain (see main.go's own startup
# warning if this is set but folds to zero usable domains). Comma-separated,
# e.g. "example.com,corp.example.com". Empty means unrestricted -- matches
# infra/.env.example's own default and disclosed tradeoff.
ssoAllowedDomains: ""

# EVAL-2: base URL of workspace-dashboard, used by evaluator to build the
# "View in Dashboard" link in the Slack auto-rollback alert above. Optional --
# unset produces a relative "/flags/{key}" link in the alert instead of an
# absolute one (evaluator's own NotifyRollback omits the button entirely in
# that case, since Slack has no defined behavior for a relative button URL).
# Not derived from ingress.hosts below: ingress can be disabled/point at a
# different domain than where the dashboard is actually reachable from an
# on-call engineer's Slack client, so this is set independently.
dashboardUrl: ""

postgresql:
  enabled: false
  host: postgres
  port: 5432
  database: tombstone
  existingSecret: tombstone-db-secret

redis:
  enabled: false
  host: redis
  port: 6379
  existingSecret: tombstone-redis-secret

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: tombstone.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: flag-api
        - path: /
          pathType: Prefix
          service: dashboard
  tls:
    - secretName: tombstone-tls
      hosts:
        - tombstone.example.com
