replicaCount: 2

global:
  imageRegistry: ""
  imagePullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: tombstone

flagApi:
  enabled: true
  image:
    repository: tombstone/flag-api
    tag: "0.1.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8081

gateway:
  enabled: true
  image:
    repository: tombstone/gateway
    tag: "0.1.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080

evaluator:
  enabled: true
  image:
    repository: tombstone/evaluator
    tag: "0.1.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8082

intelligence:
  enabled: true
  image:
    repository: tombstone/intelligence
    tag: "0.1.0"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  service:
    type: ClusterIP
    port: 8083

marketplace:
  enabled: true
  image:
    repository: tombstone/marketplace
    tag: "0.1.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8084

postgresql:
  enabled: false
  host: postgres
  port: 5432
  database: tombstone
  existingSecret: tombstone-db-secret

redis:
  enabled: false
  host: redis
  port: 6379
  existingSecret: tombstone-redis-secret

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: tombstone.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: flag-api
        - path: /
          pathType: Prefix
          service: dashboard
  tls:
    - secretName: tombstone-tls
      hosts:
        - tombstone.example.com
