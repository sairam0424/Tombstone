# Production docker-compose for Oracle Cloud Always Free ARM VM
# Runs only the 5 stateless Go services.
# gateway and intelligence run on Northflank (separate platform).
# PostgreSQL and Redis are managed externally (Neon + Upstash).

services:
  flag-api:
    build:
      context: ../../services/flag-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      # SEC-4: startup-fatal — flag-api refuses to boot without this (the
      # same class of deploy-breaker PR #254 found and fixed in the Helm
      # chart; this compose file predates SEC-4 and was never updated).
      - TOKEN_HASH_PEPPER=${TOKEN_HASH_PEPPER}
      - PORT=8081
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-bedrock}
      - BEDROCK_ACCESS_KEY_ID=${BEDROCK_ACCESS_KEY_ID}
      - BEDROCK_SECRET_ACCESS_KEY=${BEDROCK_SECRET_ACCESS_KEY}
      - BEDROCK_REGION=${BEDROCK_REGION:-us-east-1}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - REKOR_ENABLED=${REKOR_ENABLED:-false}
      - REKOR_SIGNING_KEY=${REKOR_SIGNING_KEY}
      # All non-fatal — flag-api boots fine without these, the feature they
      # gate degrades gracefully (matches Helm chart parity from PR #254).
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY}
      - COMPLIANCE_SIGNING_KEY=${COMPLIANCE_SIGNING_KEY}
      - COMPLIANCE_SIGNING_KEY_ID=${COMPLIANCE_SIGNING_KEY_ID}
      - SCIM_TOKEN=${SCIM_TOKEN}
      - SSO_PROVIDER=${SSO_PROVIDER}
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - SSO_CALLBACK_URL=${SSO_CALLBACK_URL}
      - SSO_ALLOWED_DOMAINS=${SSO_ALLOWED_DOMAINS}
      # marketplace runs in this same compose file — without this, flag-api
      # never notifies it on flag-lifecycle mutations (create/enable-disable/
      # kill/rollback-step/recovery/archive), so every Slack/Datadog/
      # PagerDuty/etc. integration silently never fires in this deployment.
      - MARKETPLACE_URL=http://marketplace:8086
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  evaluator:
    build:
      context: ../../services/evaluator
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL}
      - FLAG_API_URL=http://flag-api:8081
      - FLAG_API_TOKEN=${FLAG_API_TOKEN}
      - PORT=8082
    depends_on:
      flag-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  marketplace:
    build:
      context: ../../services/marketplace
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - REDIS_URL=${REDIS_URL}
      - FLAG_API_URL=http://flag-api:8081
      - FLAG_API_TOKEN=${FLAG_API_TOKEN}
      - DD_WEBHOOK_SECRET=${DD_WEBHOOK_SECRET}
      - EVALUATOR_URL=http://evaluator:8082
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - PORT=8086
    depends_on:
      - flag-api

  gitops-sync:
    build:
      context: ../../services/gitops-sync
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - FLAG_API_URL=http://flag-api:8081
      - FLAG_API_TOKEN=${FLAG_API_TOKEN}
      - PORT=8084
    depends_on:
      flag-api:
        condition: service_healthy

  ast-rewriter:
    build:
      context: ../../services/ast-rewriter
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    name: tombstone-prod
