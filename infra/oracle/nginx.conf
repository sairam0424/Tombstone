# /etc/nginx/sites-available/tombstone
# Reverse proxy for all Tombstone services on Oracle Cloud VM
# Replace YOUR_DOMAIN with your actual domain or Oracle public IP

upstream flag_api    { server 127.0.0.1:8081; }
upstream evaluator   { server 127.0.0.1:8082; }
upstream marketplace { server 127.0.0.1:8086; }
upstream gitops_sync { server 127.0.0.1:8084; }
upstream ast_rewriter{ server 127.0.0.1:8085; }

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # Certbot will add SSL lines here automatically
    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # X-Forwarded-For is OVERWRITTEN with the connecting address in every
    # location below, never appended to ($proxy_add_x_forwarded_for would keep
    # whatever chain the client sent). The services believe this header only
    # from the peer listed in TRUSTED_PROXY_CIDRS, and then take the entry this
    # proxy wrote, so a client-sent chain must not survive. It is repeated per
    # location on purpose: nginx inherits proxy_set_header from the server block
    # only into a location that sets none of its own, so a single server-level
    # line would not reach the locations below.
    # The services ignore X-Real-IP; it is kept for anything else that reads it.

    # flag-api — core CRUD, authentication
    location /api/v1/flags        { proxy_pass http://flag_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
    location /api/v1/environments { proxy_pass http://flag_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
    location /api/v1/audit        { proxy_pass http://flag_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
    location /api/v1/compliance   { proxy_pass http://flag_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
    location /api/v1/break-glass  { proxy_pass http://flag_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
    location /auth/               { proxy_pass http://flag_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
    location /health              { proxy_pass http://flag_api; proxy_set_header X-Forwarded-For $remote_addr; }

    # evaluator — circuit breaker, blast radius, SLO
    location /api/v1/blast-radius { proxy_pass http://evaluator; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location /api/v1/circuit      { proxy_pass http://evaluator; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location /api/v1/telemetry    { proxy_pass http://evaluator; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location /api/v1/rollback     { proxy_pass http://evaluator; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }

    # marketplace — integrations
    location /api/v1/marketplace  { proxy_pass http://marketplace; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }

    # gitops-sync — YAML flag sync
    location /api/v1/sync         { proxy_pass http://gitops_sync; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }

    # ast-rewriter — dead code scanner
    location /api/v1/scan         { proxy_pass http://ast_rewriter; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location /api/v1/rewrite      { proxy_pass http://ast_rewriter; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
}
