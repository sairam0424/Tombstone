[project]
name = "tombstone-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.32.0",
    "aiokafka>=0.11.0",
    "asyncpg>=0.29.0",
    "scikit-learn>=1.9.1",
    "numpy>=2.5.3",
    "sentence-transformers>=3.0.0",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    "httpx>=0.27.0",
    "redis[asyncio]>=5.0.0",
    "scipy>=1.18.1",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.55.0"]
snowflake = ["snowflake-connector-python>=4.8.0"]
bigquery = ["google-cloud-bigquery[pandas]>=3.0"]
databricks = ["databricks-sql-connector>=4.6.0"]
all-warehouses = [
    "snowflake-connector-python>=4.8.0",
    "google-cloud-bigquery[pandas]>=3.0",
    "databricks-sql-connector>=4.6.0",
]
clickhouse = ["clickhouse-driver>=0.2.11"]
bedrock = ["boto3>=1.43.108"]

# Linux images must not pull the ~2.7 GB CUDA wheel set (nvidia-*, triton) that
# PyPI's default torch requires. `uv pip install .` (the Dockerfile and CI) does
# NOT read [tool.uv.sources], and torch is only a transitive dependency, so the
# supported lever here is torch-backend. It is a uv-pip-only setting: `uv lock`
# and `uv sync` ignore it, so uv.lock and macOS development are unaffected.
[tool.uv.pip]
torch-backend = "cpu"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]
