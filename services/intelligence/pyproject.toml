[project]
name = "tombstone-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiokafka>=0.11.0",
    "asyncpg>=0.29.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.4",
    "sentence-transformers>=3.0.0",
    "pgvector>=0.5.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "redis[asyncio]>=5.0.0",
    "scipy>=1.13.0",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.55.0"]
snowflake = ["snowflake-connector-python>=4.7.1"]
bigquery = ["google-cloud-bigquery[pandas]>=3.0"]
databricks = ["databricks-sql-connector>=3.0"]
all-warehouses = [
    "snowflake-connector-python>=4.7.1",
    "google-cloud-bigquery[pandas]>=3.0",
    "databricks-sql-connector>=3.0",
]
clickhouse = ["clickhouse-driver>=0.2.9"]
bedrock = ["boto3>=1.34.0"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]
