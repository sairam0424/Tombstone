---
# ClusterRole grants the operator read/write access to its own CRDs
# and read access to core resources needed for leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tombstone-operator-manager-role
  labels:
    app.kubernetes.io/name: tombstone-operator
    app.kubernetes.io/component: rbac
rules:
  # --- Tombstone CRDs (full CRUD + status update) ---
  - apiGroups:
      - tombstone.io
    resources:
      - featureflags
      - flaginvironments
      - flagpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - tombstone.io
    resources:
      - featureflags/status
      - flaginvironments/status
      - flagpolicies/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - tombstone.io
    resources:
      - featureflags/finalizers
      - flaginvironments/finalizers
      - flagpolicies/finalizers
    verbs:
      - update

  # --- Core Kubernetes resources ---
  # Events: allow the operator to emit Kubernetes events for observability.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch

  # ConfigMaps + Leases: required for leader election.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

---
# ClusterRoleBinding binds the ClusterRole to the operator's ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tombstone-operator-manager-rolebinding
  labels:
    app.kubernetes.io/name: tombstone-operator
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tombstone-operator-manager-role
subjects:
  - kind: ServiceAccount
    name: tombstone-operator
    namespace: tombstone-system

---
# ServiceAccount used by the operator Deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tombstone-operator
  namespace: tombstone-system
  labels:
    app.kubernetes.io/name: tombstone-operator
    app.kubernetes.io/component: rbac

---
# Role for namespace-scoped resources within tombstone-system only.
# Use this when the operator is restricted to a single namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tombstone-operator-leader-election-role
  namespace: tombstone-system
  labels:
    app.kubernetes.io/name: tombstone-operator
    app.kubernetes.io/component: rbac
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tombstone-operator-leader-election-rolebinding
  namespace: tombstone-system
  labels:
    app.kubernetes.io/name: tombstone-operator
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tombstone-operator-leader-election-role
subjects:
  - kind: ServiceAccount
    name: tombstone-operator
    namespace: tombstone-system
